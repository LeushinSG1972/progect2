        // 1. Функция создания полосатого материала с шумом
        function createStripedMaterial(r, g, b, noiseIntensity = 0.2) {
            const canvas = document.createElement('canvas');
            const size = 512;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Заливаем фон
            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
            ctx.fillRect(0, 0, size, size);
            
            // Рисуем вертикальные полосы
            const stripeCount = 10 + Math.floor(Math.random() * 10);
            const stripeWidth = size / stripeCount;
            
            for (let i = 0; i < stripeCount; i++) {
                // Чередуем светлые и темные полосы
                const darken = i % 2 === 0 ? 0.7 : 1.3;
                ctx.fillStyle = `rgb(${r*darken}, ${g*darken}, ${b*darken})`;
                ctx.fillRect(i * stripeWidth, 0, stripeWidth, size);
            }
            
            // Добавляем шум
            const imageData = ctx.getImageData(0, 0, size, size);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                // Добавляем шум к каждому каналу
                const noise = (Math.random() - 0.5) * 255 * noiseIntensity;
                data[i]   = Math.min(255, Math.max(0, data[i]   + noise)); // R
                data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise)); // G
                data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise)); // B
            }
            
            ctx.putImageData(imageData, 0, 0);
            
            // Создаем текстуру
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 3);
            
            // Возвращаем готовый материал
            return new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.5 + Math.random() * 0.3, // Добавляем вариативность шероховатости
                metalness: 0.0,
                bumpMap: generateBumpMap(canvas), // Добавляем карту рельефа
                bumpScale: 0.05
            });
        }

        // 2. Генерация карты рельефа (bump map)
        function generateBumpMap(sourceCanvas) {
            const bumpCanvas = document.createElement('canvas');
            bumpCanvas.width = sourceCanvas.width / 2;
            bumpCanvas.height = sourceCanvas.height / 2;
            const bumpCtx = bumpCanvas.getContext('2d');
            
            // Упрощаем изображение для bump map
            bumpCtx.drawImage(sourceCanvas, 0, 0, bumpCanvas.width, bumpCanvas.height);
            
            // Конвертируем в grayscale
            const imageData = bumpCtx.getImageData(0, 0, bumpCanvas.width, bumpCanvas.height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                data[i] = data[i+1] = data[i+2] = gray;
            }
            
            bumpCtx.putImageData(imageData, 0, 0);
            
            return new THREE.CanvasTexture(bumpCanvas);
        }

        // 3. Функция создания цилиндра (без изменений)
        function createCylinder(d, x, y, z, v, material, scene) {
            const geometry = new THREE.CylinderGeometry(0.5, 0.5, d, 32);
            const cylinder = new THREE.Mesh(geometry, material);
            cylinder.position.set(x, y, z);
            
            if (v === 0) cylinder.rotation.z = Math.PI/2;
            if (v === 2) cylinder.rotation.x = Math.PI/2;
            
            scene.add(cylinder);
            return cylinder;
        }
